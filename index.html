<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação Microscópica - Pilha de Daniell Avançada</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #94a3b8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #f8fafc;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .controls-panel {
            margin-top: 12px;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            max-width: 950px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 11px;
        }
        label { margin-bottom: 3px; color: #cbd5e1; font-weight: 600; }
        span { color: #38bdf8; }
        input[type=range] {
            accent-color: #38bdf8;
            cursor: pointer;
            width: 130px;
        }
        .btn-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 12px;
        }
        button:hover { background-color: #7dd3fc; }
        .info-box {
            margin-top: 10px;
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 8px 15px;
            border-radius: 0 8px 8px 0;
            max-width: 920px;
            width: 100%;
            font-size: 12px;
            color: #e2e8f0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>PILHA DE DANIELL — Análise Microscópica e Termodinâmica</h2>

    <div class="canvas-container">
        <canvas id="simCanvas" width="900" height="420"></canvas>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label>Tempo (Linha do Tempo): <span id="timeVal">0</span>%</label>
            <input type="range" id="timeSlider" min="0" max="100" value="0">
        </div>
        
        <div class="control-group">
            <div class="btn-container" style="margin-top: 14px;">
                <button id="playBtn">▶ Iniciar</button>
                <button id="resetBtn" style="background-color: #64748b; color: #fff;">⟲ Reiniciar</button>
            </div>
        </div>

        <div class="control-group">
            <label>Duração: <span id="durationVal">10</span>s</label>
            <input type="range" id="durationSlider" min="1" max="30" value="10">
        </div>

        <div class="control-group">
            <label>Voltagem Aplicada: <span id="voltVal">1.10</span>V</label>
            <input type="range" id="voltSlider" min="0.0" max="10.0" step="0.1" value="1.10">
        </div>

        <div class="control-group">
            <label>Átomos Zn (Ânodo): <span id="znAtomsVal">10</span></label>
            <input type="range" id="znAtomsSlider" min="4" max="24" value="10">
        </div>

        <div class="control-group">
            <label>Íons Cu²⁺ (Cátodo): <span id="cuAtomsVal">10</span></label>
            <input type="range" id="cuAtomsSlider" min="4" max="24" value="10">
        </div>
    </div>

    <div class="info-box" id="infoText">
        <b>Análise em Tempo Real:</b> Ajuste os parâmetros para observar o comportamento microscópico da célula eletroquímica.
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const timeSlider = document.getElementById('timeSlider');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const durationSlider = document.getElementById('durationSlider');
    const voltSlider = document.getElementById('voltSlider');
    const znAtomsSlider = document.getElementById('znAtomsSlider');
    const cuAtomsSlider = document.getElementById('cuAtomsSlider');

    const timeVal = document.getElementById('timeVal');
    const durationVal = document.getElementById('durationVal');
    const voltVal = document.getElementById('voltVal');
    const znAtomsVal = document.getElementById('znAtomsVal');
    const cuAtomsVal = document.getElementById('cuAtomsVal');
    const infoText = document.getElementById('infoText');

    let isPlaying = false;
    let lastTimestamp = null;
    let currentProgress = 0;

    function drawSphere(x, y, radius, colorBase, labelText = "") {
        let grad = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, colorBase);
        grad.addColorStop(1, '#050505');

        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 5;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        if (labelText) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 8px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(labelText, x, y);
        }
    }

    function updateDescription(voltage, znCount, cuCount) {
        let text = "";
        let limitante = Math.min(znCount, cuCount);
        if (voltage === 1.10) {
            text = `<b>Estado de Equilíbrio Padrão (1.10V):</b> A pilha opera no potencial termodinâmico ideal. A taxa de oxidação do Zinco equilibra-se com a redução do Cobre.`;
        } else if (voltage > 1.10) {
            text = `<b>Eletrólise / Sobretensão (${voltage.toFixed(1)}V):</b> Fonte externa forçando alta intensidade de corrente e migração acelerada de cargas.`;
        } else if (voltage > 0) {
            text = `<b>Sub-potencial (${voltage.toFixed(2)}V):</b> Força motriz reduzida, diminuindo a velocidade de transferência de elétrons.`;
        } else {
            text = `<b>Circuito Aberto ($0.0V$):</b> Sem diferença de potencial; reação espontânea interrompida.`;
        }
        text += ` <i>Reagente limitante ativo:</i> O processo completo é limitado pelo menor saldo entre os ${znCount} átomos de Zn e os ${cuCount} íons Cu²⁺.`;
        infoText.innerHTML = text;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let progress = currentProgress / 100;
        let znTotal = parseInt(znAtomsSlider.value);
        let cuTotal = parseInt(cuAtomsSlider.value);
        let voltage = parseFloat(voltSlider.value);

        timeVal.innerText = Math.round(currentProgress);
        durationVal.innerText = durationSlider.value;
        voltVal.innerText = voltage.toFixed(1);
        znAtomsVal.innerText = znTotal;
        cuAtomsVal.innerText = cuTotal;

        updateDescription(voltage, znTotal, cuTotal);

        // --- CUBAS E SOLUÇÕES ---
        let gradLeft = ctx.createLinearGradient(100, 110, 100, 360);
        gradLeft.addColorStop(0, 'rgba(56, 189, 248, 0.05)');
        gradLeft.addColorStop(1, 'rgba(56, 189, 248, 0.15)');
        ctx.fillStyle = gradLeft;
        ctx.fillRect(70, 110, 340, 260);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.strokeRect(70, 110, 340, 260);

        let gradRight = ctx.createLinearGradient(490, 110, 490, 360);
        gradRight.addColorStop(0, 'rgba(37, 99, 235, 0.08)');
        gradRight.addColorStop(1, 'rgba(37, 99, 235, 0.22)');
        ctx.fillStyle = gradRight;
        ctx.fillRect(490, 110, 340, 260);
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.35)';
        ctx.strokeRect(490, 110, 340, 260);

        // --- ELETRODOS ---
        let znMetalGrad = ctx.createLinearGradient(110, 140, 150, 140);
        znMetalGrad.addColorStop(0, '#64748b');
        znMetalGrad.addColorStop(0.5, '#cbd5e1');
        znMetalGrad.addColorStop(1, '#475569');
        ctx.fillStyle = znMetalGrad;
        ctx.fillRect(110, 140, 35, 190);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText("Zn (Ânodo)", 127, 125);

        let cuMetalGrad = ctx.createLinearGradient(745, 140, 785, 140);
        cuMetalGrad.addColorStop(0, '#9a3412');
        cuMetalGrad.addColorStop(0.5, '#f97316');
        cuMetalGrad.addColorStop(1, '#7c2d12');
        ctx.fillStyle = cuMetalGrad;
        ctx.fillRect(745, 140, 35, 190);
        ctx.fillStyle = '#f8fafc';
        ctx.fillText("Cu (Cátodo)", 762, 125);

        // --- FIAÇÃO E VOLTÍMETRO ---
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(127, 140);
        ctx.lineTo(127, 65);
        ctx.lineTo(450, 65);
        ctx.lineTo(762, 65);
        ctx.lineTo(762, 140);
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = voltage === 0 ? '#ef4444' : (voltage < 1.10 ? '#f59e0b' : '#38bdf8');
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(450, 65, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.fillStyle = ctx.strokeStyle;
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(voltage.toFixed(1) + "V", 450, 61);
        ctx.font = '8px Segoe UI';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(voltage > 1.10 ? "Forçado" : "Espontâneo", 450, 75);

        // --- FLUXO DE ELÉTRONS ---
        if (progress > 0 && progress < 1 && voltage > 0) {
            let electronCount = Math.max(1, Math.min(6, Math.floor(voltage * 2)));
            for (let e = 0; e < electronCount; e++) {
                let speedFactor = Math.max(0.2, voltage / 1.10);
                let eProgress = ((progress * speedFactor * 1.5) + (e * (1 / electronCount))) % 1;
                let ex = 127 + eProgress * (762 - 127);
                drawSphere(ex, 65, 4, '#38bdf8', 'e⁻');
            }
        }

        // --- ESTEQUIOMETRIA ESCALONADA CORRETA ---
        let effectiveReaction = Math.min(znTotal, cuTotal);
        let currentReacted = Math.floor(progress * effectiveReaction);

        // Zinco: desgaste proporcional
        for (let i = 0; i < znTotal; i++) {
            let col = i % 2;
            let row = Math.floor(i / 2);
            let x = 117 + col * 15;
            let y = 150 + row * 14;

            if (i >= (znTotal - currentReacted)) {
                let floatX = x + 45 + (i * 10) % 60;
                let floatY = y + (i * 5) % 40;
                drawSphere(floatX, floatY, 6.5, '#38bdf8', 'Zn²⁺');
            } else {
                drawSphere(x, y, 6, '#94a3b8');
            }
        }

        // Cobre: íons livres que se convertem em depósito metálico no cátodo de forma equivalente
        for (let i = 0; i < cuTotal; i++) {
            let startX = 520 + (i % 4) * 25;
            let startY = 150 + Math.floor(i / 4) * 22;

            if (i < currentReacted) {
                // Depositado firmemente no cátodo proporcionalmente à reação real
                let cuCol = i % 2;
                let cuRow = Math.floor(i / 2);
                drawSphere(753 + cuCol * 10, 150 + cuRow * 14, 6, '#f97316', 'Cu');
            } else {
                // Íons livres na solução
                drawSphere(startX, startY, 6.5, '#2563eb', 'Cu²⁺');
            }
        }
    }

    function loop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let deltaTime = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (isPlaying) {
            let durationSec = parseFloat(durationSlider.value);
            let increment = (deltaTime / durationSec) * 100;
            
            currentProgress += increment;
            if (currentProgress >= 100) {
                currentProgress = 100;
                stopSimulation();
            }
            timeSlider.value = currentProgress;
            draw();
            requestAnimationFrame(loop);
        }
    }

    function startSimulation() {
        if (isPlaying) {
            stopSimulation();
            return;
        }
        if (currentProgress >= 100) {
            currentProgress = 0;
        }
        isPlaying = true;
        lastTimestamp = null;
        playBtn.innerText = "⏸ Pausar";
        playBtn.style.backgroundColor = "#f59e0b";
        requestAnimationFrame(loop);
    }

    function stopSimulation() {
        isPlaying = false;
        playBtn.innerText = "▶ Iniciar";
        playBtn.style.backgroundColor = "#38bdf8";
    }

    playBtn.addEventListener('click', startSimulation);
    
    resetBtn.addEventListener('click', () => {
        stopSimulation();
        currentProgress = 0;
        timeSlider.value = 0;
        draw();
    });

    timeSlider.value = 0;
    timeSlider.addEventListener('input', (e) => {
        if (isPlaying) stopSimulation();
        currentProgress = parseFloat(e.target.value);
        draw();
    });

    durationSlider.addEventListener('input', () => { durationVal.innerText = durationSlider.value; });
    voltSlider.addEventListener('input', draw);
    znAtomsSlider.addEventListener('input', draw);
    cuAtomsSlider.addEventListener('input', draw);

    draw();
</script>

</body>
</html>
